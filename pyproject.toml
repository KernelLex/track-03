[project]
name = "truecommit"
version = "0.1.0"
description = "TrueCommit — a bounded autonomous agent for Indian B2B and subscription revenue recovery (Razorpay AI Buildathon 2026, Track 03)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "razorpay>=1.4",
    "kagglehub>=1.0.2",
    "anthropic>=0.69",
]

[project.scripts]
trucommit = "agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "pandas>=3.0.5",
    "numpy>=2.5.2",
    "scikit-learn>=1.9.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
